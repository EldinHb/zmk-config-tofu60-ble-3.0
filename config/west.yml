manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: yangdigi
      url-base: https://github.com/yangdigi
    - name: nguyendown
      url-base: https://github.com/nguyendown
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: yangdigi
      revision: main
      import: app/west.yml
    - name: zmk-keyboards-klink
      remote: yangdigi
      revision: main
    # SOCD cleaner behavior (zmk,behavior-socd); pinned to a known-good commit
    - name: zmk-behavior-socd
      remote: nguyendown
      revision: 0e3dfde
  self:
    path: config
