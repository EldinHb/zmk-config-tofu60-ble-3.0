name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: yangdigi/zmk/.github/workflows/build-user-config.yml@main

  rename:
    needs: build
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Load config
        id: cfg
        run: |
          source .github/config.env
          echo "kbd=$KBD" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v7
        with:
          name: firmware
          path: firmware

      - name: Set artifact name
        id: meta
        run: |
          DATE=$(date +'%Y%m%d')
          echo "name=firmware-${{ steps.cfg.outputs.kbd }}_zmk_${DATE}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.name }}
          path: firmware

      - name: Delete original firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name=="firmware") | .id')

          [[ -n "$ARTIFACT_ID" ]] && \
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID

      # Publish a GitHub Release for every successful build of main, mirroring the
      # upstream release layout (tag fw_YYMMDD, asset firmware-<kbd>_zmk_<YYYYMMDD>.zip).
      # A short commit hash keeps tags unique when main is built more than once a day.
      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="fw_$(date +'%y%m%d')-${SHORT_SHA}"
          NAME="${{ steps.meta.outputs.name }}"
          (cd firmware && zip -r "../${NAME}.zip" .)
          gh release create "${TAG}" "${NAME}.zip" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${NAME}" \
            --notes "Built from ${{ github.sha }} by run ${{ github.run_id }}.

Flash: enter the bootloader (hold RESET 3 s, or battery switch off + hold Esc while plugging in USB), then copy the .uf2 for your layout to the KLINK-BOOT drive."
